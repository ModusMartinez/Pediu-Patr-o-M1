<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Novo pedido</title>
</head>
<body>
<div th:fragment="content">
    <h2 class="fw-bold mb-4">Novo pedido</h2>
    <div class="alert alert-danger" th:if="${erro}" th:text="${erro}"></div>

    <form th:action="@{/pedidos/salvar}" method="post" class="card card-body">
        <label for="cliente" class="form-label">Cliente</label>
        <select id="cliente" name="clienteId" class="form-select mb-4" required>
            <option value="">Selecione um cliente</option>
            <option th:each="cliente : ${clientes}" th:value="${cliente.id}" th:text="${cliente.nome}"></option>
        </select>

        <p>Selecione produtos ativos cadastrados em <a href="/produtos">Produtos</a>.</p>
        <div id="itens"></div>
        <div class="mb-3">
            <button type="button" class="btn btn-outline-primary" onclick="adicionar()">Adicionar item</button>
        </div>
        <p class="text-muted">Os preços e o valor total serão calculados pelo sistema ao salvar.</p>
        <div>
            <button type="submit" class="btn btn-primary">Salvar pedido</button>
            <a href="/pedidos" class="btn btn-outline-secondary">Voltar</a>
        </div>
    </form>

    <template id="modelo-item">
        <div class="item row g-2 mb-3 align-items-end">
            <div class="col-md-7">
                <label class="form-label">Produto</label>
                <select class="form-select" required>
                    <option value="">Selecione um produto</option>
                    <option th:each="produto : ${produtos}" th:if="${produto.ativo == true}"
                            th:value="${produto.id}"
                            th:text="${produto.nome + ' - R$ ' + #numbers.formatDecimal(produto.preco, 1, 'POINT', 2, 'COMMA')}"></option>
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label">Quantidade</label>
                <input type="number" class="form-control" min="1" step="1" value="1" required>
            </div>
            <div class="col-md-2">
                <button type="button" class="btn btn-outline-danger" onclick="remover(this)">Remover</button>
            </div>
        </div>
    </template>

    <script>
        function organizar() {
            document.querySelectorAll('#itens .item').forEach((linha, indice) => {
                linha.querySelector('select').name = 'itens[' + indice + '].produtoId';
                linha.querySelector('input').name = 'itens[' + indice + '].quantidade';
            });
        }

        function adicionar() {
            const modelo = document.getElementById('modelo-item');
            document.getElementById('itens').appendChild(modelo.content.cloneNode(true));
            organizar();
        }

        function remover(botao) {
            botao.closest('.item').remove();
            organizar();
        }

        adicionar();
    </script>
</div>
</body>
</html>
