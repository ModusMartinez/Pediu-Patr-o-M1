<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Lista de Pedidos</title>
</head>
<body>

<div th:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">
            <i class="bi bi-bag me-2 text-primary"></i>Pedidos
        </h2>
        <a href="/pedidos/novo" class="btn btn-primary"
           th:if="${perfil == 'ROLE_GERENTE' or perfil == 'ROLE_ATENDENTE'}">Novo pedido</a>
    </div>

    <!-- Mensagens de feedback -->
    <div class="alert alert-success alert-dismissible fade show" th:if="${sucesso}" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${sucesso}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div class="alert alert-danger alert-dismissible fade show" th:if="${erro}" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${erro}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Tabela -->
    <div class="card shadow-sm">
        <div class="card-body p-0 table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th class="ps-4">ID</th>
                        <th>Cliente</th>
                        <th>Itens</th>
                        <th>Subtotal</th>
                        <th>Desconto (%)</th>
                        <th>Total</th>
                        <th>Entrada</th>
                        <th>Responsável</th>
                        <th>Saída / responsável</th>
                        <th>Status</th>
                        <th th:if="${perfil == 'ROLE_GERENTE'}">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Lista vazia -->
                    <tr th:if="${#lists.isEmpty(pedidos)}">
                        <td th:colspan="${perfil == 'ROLE_GERENTE' ? 11 : 10}" class="text-center text-muted py-5">
                            <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                            Nenhum pedido encontrado.
                        </td>
                    </tr>
                    <!-- Linhas -->
                    <tr th:each="pedido : ${pedidos}">
                        <td class="ps-4 text-muted" th:text="${pedido.id}"></td>
                        <td th:text="${pedido.clienteNome ?: pedido.clienteId}"></td>
                        <td>
                            <div th:each="item : ${pedido.itens}" class="mb-2">
                                <span th:text="${item.quantidade + ' x ' + item.nome}"></span>
                                <small class="d-block text-muted"
                                       th:text="${'R$ ' + #numbers.formatDecimal(item.preco, 1, 'POINT', 2, 'COMMA') + ' cada | R$ ' + #numbers.formatDecimal(item.subtotal, 1, 'POINT', 2, 'COMMA')}"></small>
                            </div>
                            <span th:if="${#lists.isEmpty(pedido.itens)}"
                                  th:text="${pedido.quantidade + ' x ' + (pedido.sabor ?: (pedido.tipoPizza ?: 'Pedido antigo'))}"></span>
                        </td>
                        <td th:text="${pedido.subtotal != null ? 'R$ ' + #numbers.formatDecimal(pedido.subtotal, 1, 'POINT', 2, 'COMMA') : 'Não informado'}"></td>
                        <td th:text="${pedido.desconto != null ? #numbers.formatDecimal(pedido.desconto, 1, 'POINT', 2, 'COMMA') : '—'}"></td>
                        <td th:text="${pedido.total != null ? 'R$ ' + #numbers.formatDecimal(pedido.total, 1, 'POINT', 2, 'COMMA') : 'Não informado'}"></td>
                        <td th:text="${pedido.entrada != null ? #temporals.format(pedido.entrada, 'dd/MM/yyyy HH:mm:ss') : '—'}"></td>
                        <td th:text="${pedido.responsavel ?: '—'}"></td>
                        <td>
                            <span th:text="${pedido.saida != null ? #temporals.format(pedido.saida, 'dd/MM/yyyy HH:mm:ss') : '—'}"></span>
                            <small class="d-block text-muted" th:text="${pedido.responsavelSaida ?: ''}"></small>
                        </td>
                        <td>
                            <span class="badge"
                                  th:classappend="${pedido.status == 'FINALIZADO' or pedido.status == 'ENTREGUE'} ? 'bg-success' :
                                                  (${pedido.status == 'CANCELADO'} ? 'bg-danger' :
                                                  (${pedido.status == 'EM_PREPARACAO' or pedido.status == 'EM_PREPARO'} ? 'bg-warning text-dark' : 'bg-secondary'))"
                                  th:text="${pedido.status != null ? #strings.replace(pedido.status, '_', ' ') : '—'}">
                            </span>
                            <small th:if="${pedido.justificativaCancelamento != null}" class="d-block mt-1"
                                   th:text="${pedido.justificativaCancelamento}"></small>
                        </td>
                        <td th:if="${perfil == 'ROLE_GERENTE'}">
                            <form th:if="${pedido.status == 'RECEBIDO' or pedido.status == 'EM_PREPARACAO' or pedido.status == 'PRONTO' or pedido.status == 'SAIU_PARA_ENTREGA' or pedido.status == 'RETIRADO'}"
                                  th:action="@{/pedidos/{id}/status(id=${pedido.id})}" method="post">
                                <button th:if="${pedido.status == 'RECEBIDO'}" type="submit" name="status"
                                        value="EM_PREPARACAO" class="btn btn-sm btn-primary">Iniciar preparo</button>
                                <button th:if="${pedido.status == 'EM_PREPARACAO'}" type="submit" name="status"
                                        value="PRONTO" class="btn btn-sm btn-primary">Marcar pronto</button>
                                <button th:if="${pedido.status == 'PRONTO'}" type="submit" name="status"
                                        value="SAIU_PARA_ENTREGA" class="btn btn-sm btn-primary mb-1">Saiu para entrega</button>
                                <button th:if="${pedido.status == 'PRONTO'}" type="submit" name="status"
                                        value="RETIRADO" class="btn btn-sm btn-primary">Registrar retirada</button>
                                <button th:if="${pedido.status == 'SAIU_PARA_ENTREGA' or pedido.status == 'RETIRADO'}"
                                        type="submit" name="status" value="FINALIZADO" class="btn btn-sm btn-success">Finalizar</button>
                            </form>
                            <div th:if="${pedido.saida == null and (pedido.status == 'RECEBIDO' or pedido.status == 'EM_PREPARACAO' or pedido.status == 'PRONTO')}">
                                <details class="mt-2" th:if="${pedido.subtotal != null and pedido.subtotal > 0}">
                                    <summary>Desconto</summary>
                                    <form th:action="@{/pedidos/{id}/desconto(id=${pedido.id})}" method="post" class="mt-2">
                                        <label th:for="${'desconto-' + pedido.id}" class="form-label">Desconto (%)</label>
                                        <input type="number" th:id="${'desconto-' + pedido.id}" name="desconto"
                                               th:value="${pedido.desconto ?: 0}" min="0" max="20" step="0.01"
                                               required class="form-control form-control-sm">
                                        <button type="submit" class="btn btn-sm btn-primary mt-1">Aplicar desconto</button>
                                    </form>
                                </details>
                                <details class="mt-2">
                                    <summary>Cancelar pedido</summary>
                                    <form th:action="@{/pedidos/{id}/cancelar(id=${pedido.id})}" method="post" class="mt-2">
                                        <label th:for="${'justificativa-' + pedido.id}" class="form-label">Justificativa</label>
                                        <textarea th:id="${'justificativa-' + pedido.id}" name="justificativa" rows="2"
                                                  required class="form-control form-control-sm"></textarea>
                                        <button type="submit" class="btn btn-sm btn-danger mt-1">Confirmar cancelamento</button>
                                    </form>
                                </details>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="card-footer text-muted small" th:if="${!#lists.isEmpty(pedidos)}">
            Total: <strong th:text="${#lists.size(pedidos)}"></strong> pedido(s)
        </div>
    </div>

</div>

</body>
</html>
