<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Gerenciar Produtos</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
        <link rel="stylesheet" th:href="@{/css/style.css}">
    </head>
    <body>
        <!-- Sidebar incluído como fragmento -->
        <aside>
            <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        </aside>

        <div class="container mt-5" th:fragment="content">
            <h1 class="mb-4">Gestão de Produtos</h1>
            <div class="alert alert-success" th:if="${sucesso}" th:text="${sucesso}"></div>
            <div class="alert alert-danger" th:if="${erro}" th:text="${erro}"></div>

            <!-- Botão para abrir o formulário -->
            <button th:if="${produto.id == null}" class="btn btn-primary mb-3" data-bs-toggle="collapse" data-bs-target="#formularioProduto">
                Novo Produto
            </button>
            <a th:if="${produto.id != null}" href="/produtos" class="btn btn-primary mb-3">Novo Produto</a>

            <!-- Formulário de Cadastro -->
            <div class="collapse" id="formularioProduto" th:classappend="${produto.id != null ? 'show' : ''}">
                <div class="card card-body">
                    <h5 th:text="${produto.id == null ? 'Novo produto' : 'Editar produto'}"></h5>
                    <form th:action="@{/produtos/salvar}" th:object="${produto}" method="post" id="produtoForm">
                        <input th:if="${produto.id != null}" type="hidden" th:field="*{id}">
                        <div class="mb-3">
                            <label for="nome" class="form-label">Nome do Produto</label>
                            <input type="text" id="nome" th:field="*{nome}" class="form-control" placeholder="Nome do Produto" required>
                        </div>

                        <div class="mb-3">
                            <label for="tipo" class="form-label">Tipo do Produto</label>
                            <select id="tipo" th:field="*{tipo}" class="form-select" required>
                                <option value="" disabled>Selecione o Tipo</option>
                                <option value="Pizza">Pizza</option>
                                <option value="Lanche">Lanche</option>
                                <option value="Bebida">Bebida</option>
                                <option value="Porção">Porção</option>
                                <option value="Adicional">Adicional</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="preco" class="form-label">Preço</label>
                            <input type="number" id="preco" th:field="*{preco}" class="form-control" placeholder="Preço (R$)" min="0.01" step="0.01" required>
                        </div>

                        <div class="form-check mb-3">
                            <input type="checkbox" id="ativo" th:field="*{ativo}" class="form-check-input">
                            <label for="ativo" class="form-check-label">Produto Ativo</label>
                        </div>

                        <div class="d-flex justify-content-end">
                            <button type="submit" class="btn btn-success">Salvar</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Listagem de Produtos -->
            <table class="table table-bordered table-striped mt-3">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>Tipo</th>
                        <th>Preço</th>
                        <th>Ativo</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Loop para listar os produtos -->
                    <tr th:each="produto : ${produtos}">
                        <td th:text="${produto.id}"></td>
                        <td th:text="${produto.nome}"></td>
                        <td th:text="${produto.tipo}"></td>
                        <td th:text="${#numbers.formatDecimal(produto.preco, 1, 'POINT', 2, 'COMMA')}"></td>
                        <td th:text="${produto.ativo == true ? 'Sim' : 'Não'}">Sim</td>
                        <td>
                            <a th:href="@{/produtos/editar/{id}(id=${produto.id})}" class="btn btn-warning btn-sm">Editar</a>
                            <form th:action="@{/produtos/excluir/{id}(id=${produto.id})}" method="post" class="d-inline"
                                  onsubmit="return confirm('Tem certeza que deseja excluir este produto?');">
                                <button type="submit" class="btn btn-danger btn-sm">Excluir</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <script th:src="@{/js/script.js}"></script>
    </body>
</html>
