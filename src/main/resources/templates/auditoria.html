<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Auditoria</title>
</head>
<body>
<div th:fragment="content">
    <h2 class="fw-bold mb-4">Auditoria</h2>

    <p class="text-muted" th:if="${#lists.isEmpty(registros)}">Nenhum registro de auditoria encontrado.</p>

    <div class="card mb-3" th:each="registro : ${registros}">
        <div class="card-header d-flex justify-content-between">
            <strong th:text="${registro.operacao + ' DE ' + registro.entidade}"></strong>
            <span th:text="${#temporals.format(registro.dataHora, 'dd/MM/yyyy HH:mm:ss')}"></span>
        </div>
        <div class="card-body">
            <p>
                Usuário: <strong th:text="${registro.usuario}"></strong>
                (<span th:text="${registro.perfil}"></span>)
                | Identificador: <span th:text="${registro.entidadeId}"></span>
            </p>
            <div class="table-responsive">
                <table class="table table-bordered table-sm mb-0">
                    <thead>
                        <tr><th>Campo</th><th>Valor anterior</th><th>Novo valor</th></tr>
                    </thead>
                    <tbody>
                        <tr th:each="campo : ${registro.valoresNovos}">
                            <td th:text="${campo.key}"></td>
                            <td th:text="${registro.valoresAnteriores[campo.key] ?: '—'}"></td>
                            <td th:text="${campo.value ?: '—'}"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <p class="mt-3 mb-0" th:if="${!#strings.isEmpty(registro.justificativa)}">
                Justificativa: <span th:text="${registro.justificativa}"></span>
            </p>
        </div>
    </div>
</div>
</body>
</html>
