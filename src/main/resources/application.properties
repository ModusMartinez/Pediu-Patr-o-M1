# Banco local por padrão. Para outro banco, defina MONGODB_URI no ambiente.
spring.data.mongodb.uri=${MONGODB_URI:mongodb://127.0.0.1:27017/pizzaria}
spring.data.mongodb.database=${MONGODB_DATABASE:pizzaria}

# Configuração particular opcional, ignorada pelo Git.
spring.config.import=optional:file:./application-local.properties

# Desenvolvimento acessível apenas neste computador por padrão.
server.address=${SERVER_ADDRESS:127.0.0.1}

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false

logging.level.com.umc.pediupatrao=DEBUG
